name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build bettergive.csproj -c ${{ matrix.configuration }} --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bettergive-${{ matrix.configuration }}
          path: bin/${{ matrix.configuration }}/bettergive.dll
